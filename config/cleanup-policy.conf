# ==============================================================================
# MINTCARE LAB — POLÍTICA DE LIMPIEZA (config/cleanup-policy.conf)
# ==============================================================================
# Define las categorías, reglas de seguridad y límites del sistema.
# ==============================================================================

# Modo por defecto: audit (solo lectura)
DEFAULT_MODE="audit"

# Cuarentena local (no usar para cachés masivas > 1GB)
QUARANTINE_DIR="${MINTCARE_DIR:-$HOME/MintCareLab}/quarantine"
MAX_QUARANTINE_SIZE_MB=1024

# Umbral de alerta de espacio libre en disco (en GB)
LOW_SPACE_THRESHOLD_GB=20

# Reglas de confirmación
REQUIRE_EXPLICIT_CONFIRMATION=true
DOUBLE_CONFIRM_MASSIVE=true
MASSIVE_THRESHOLD_GB=5

# Retención de logs (días)
LOG_RETENTION_DAYS=30
