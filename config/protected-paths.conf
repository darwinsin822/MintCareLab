# ==============================================================================
# MINTCARE LAB — CONFIGURACIÓN DE RUTAS PROTEGIDAS (config/protected-paths.conf)
# ==============================================================================
# REGLA SUPREMA: Protección absoluta de Documentos y Música y datos críticos.
# Ninguna operación destructiva, de escritura o modificación de MintCare Lab
# puede tocar directa o indirectamente estas rutas ni sus subdirectorios.
# ==============================================================================

# 1. Carpetas Personales Intocables (Regla Suprema)
~/Documentos
~/Documents
~/Música
~/Music

# 2. Almacenamiento Remoto y Montajes Rclone
~/Drive

# 3. Credenciales, Llaves y Secretos
~/.ssh
~/.gnupg
~/.pki

# 4. Proyectos y Datos Vitales del Usuario
~/Descargas/MUSIC_INBOX
~/.gemini/antigravity/scratch
~/.gemini/antigravity/brain
~/.gemini/antigravity/conversations
~/.gemini/config

# 5. Editor de Oficina Protegido
/usr/bin/onlyoffice-desktopeditors
~/.config/onlyoffice
~/.local/share/onlyoffice
/var/lib/flatpak/app/org.onlyoffice.desktopeditors
~/.var/app/org.onlyoffice.desktopeditors

# 6. Raíz y Sistemas de Archivos Críticos
/
/boot
/etc
/sys
/proc
/dev
/lib
/usr
/bin
/sbin
